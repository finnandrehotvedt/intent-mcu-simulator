name: intent-mcu-x26-private

services:
  candidate:
    image: local/intent-mcu-x26:1.1.0-rc.48-private
    container_name: intent-mcu-x26-candidate
    user: "1000:1000"
    group_add:
      - "112"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 2.0
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/codex-workspaces/_staging/stm32-source-build-20261016/intent-mcu-stm32-source-build-private-candidate-1.1.0-rc.22/compiler/image-lock.json:/run/locks/avr.json:ro
    ports:
      - "127.0.0.1:18791:18766"
    environment:
      HOME: /tmp
      NO_UPDATE_NOTIFIER: "1"
      STAGING_HOST: 0.0.0.0
      STAGING_PORT: "18766"
      PUBLIC_ORIGIN: http://127.0.0.1:18791
      COMPILER_IMAGE_LOCK: /run/locks/avr.json
      RP2040_COMPILER_IMAGE_LOCK: /workspace/compiler/rp2040-image-lock.json
      ENABLE_ESP32C3_PUBLIC: "1"
      ESP32C3_BUILDER_IMAGE_LOCK: /workspace/compiler/esp32c3-image-lock.json
      ESP32C3_RUNTIME_IMAGE_LOCK: /workspace/c3/runtime-image-lock.json
      ENABLE_STM32_PUBLIC: "1"
      STM32_BUILDER_IMAGE_LOCK: /workspace/stm32/builder-image-lock.json
      STM32_RUNTIME_IMAGE_LOCK: /workspace/stm32/runtime-image-lock.json
      DEPLOYMENT_SCOPE: local-source
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18766/readyz"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  {}
